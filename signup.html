<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - True Love Assemblies of God</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Welcome to True Love Assemblies of God</h1>
    <p>Create your account and tell us a little about yourself.</p>
    <form id="signupForm">
      <h3>Account details</h3>
      <label for="full_name">Full name *</label>
      <input type="text" id="full_name" required>

      <label for="email">Email *</label>
      <input type="email" id="email" required>

      <label for="password">Password * (at least 8 characters)</label>
      <input type="password" id="password" minlength="8" required>

      <label for="phone">Phone number *</label>
      <input type="tel" id="phone" placeholder="e.g. 024 000 0000" required>

      <h3>About you</h3>
      <label for="date_of_birth">Date of birth</label>
      <input type="date" id="date_of_birth">

      <label for="gender">Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label for="marital_status">Marital status</label>
      <select id="marital_status">
        <option value="">Select</option>
        <option>Single</option>
        <option>Married</option>
        <option>Divorced</option>
        <option>Widowed</option>
      </select>

      <label for="address">Address / Area</label>
      <input type="text" id="address">

      <h3>Emergency contact</h3>
      <label for="emergency_contact_name">Contact name</label>
      <input type="text" id="emergency_contact_name">

      <label for="emergency_contact_phone">Contact phone</label>
      <input type="tel" id="emergency_contact_phone">

      <h3>Church</h3>
      <label for="member_type">I am a</label>
      <select id="member_type">
        <option value="visitor">First-time visitor</option>
        <option value="member">Church member</option>
      </select>

      <label for="how_heard">How did you hear about us?</label>
      <select id="how_heard">
        <option value="">Select</option>
        <option>Friend or family</option>
        <option>Social media</option>
        <option>Online search</option>
        <option>Church event</option>
        <option>Other</option>
      </select>

      <label for="interests">Ministries or groups you're interested in</label>
      <input type="text" id="interests" placeholder="e.g. Choir, Youth, Ushering">

      <div class="checkbox-row">
        <input type="checkbox" id="consent" required>
        <label for="consent">I agree that the church may store and use my personal information for church administration and communication. *</label>
      </div>

      <button type="submit" id="submitBtn">Create account</button>
      <div id="message" class="message"></div>
    </form>

    <p class="small">Already have an account? <a href="login.html">Sign in</a></p>
  </div>

  <!-- Supabase library, then your config, then the page script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const form = document.getElementById("signupForm");
    const msg = document.getElementById("message");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "message";
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await db.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: document.getElementById("full_name").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            date_of_birth: document.getElementById("date_of_birth").value,
            gender: document.getElementById("gender").value,
            marital_status: document.getElementById("marital_status").value,
            address: document.getElementById("address").value.trim(),
            emergency_contact_name: document.getElementById("emergency_contact_name").value.trim(),
            emergency_contact_phone: document.getElementById("emergency_contact_phone").value.trim(),
            member_type: document.getElementById("member_type").value,
            how_heard: document.getElementById("how_heard").value,
            interests: document.getElementById("interests").value.trim(),
            consent: document.getElementById("consent").checked
          }
        }
      });

      btn.disabled = false;
      btn.textContent = "Create account";

      if (error) {
        msg.className = "message error";
        msg.textContent = error.message;
      } else {
        msg.className = "message success";
        msg.textContent = "Account created! Please check your email and click the confirmation link, then sign in.";
        form.reset();
      }
    });
  </script>
</body>
</html>
